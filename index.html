<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hadi & Claud - Wedding Invitation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="cover" id="cover">
        <div class="cover-overlay"></div>
        <div class="cover-content">
            <div class="cover-photo">
                <img src="assets/cover.jpeg" alt="Hadi dan Claud">
            </div>
            <h1 class="cover-name">
                Hadi
                <span>&</span>
                Claud
            </h1>
            <button class="open-button" id="openInvitation">
                Met Our Wedding
            </button>
        </div>
    </section>

    <main id="mainWebsite" class="main-website">
        <section class="hero">
            <div class="hero-background"></div>
            <div class="hero-content">
                <div class="date">
                    <span>30</span>
                    <span>12</span>
                    <span>2026</span>
                </div>
                <div class="photo photo-claud">
                    <img src="assets/claud.jpg" alt="Claud">
                </div>
                <div class="photo photo-hadi">
                    <img src="assets/hadi.jpg" alt="Hadi">
                </div>


                <!-- Nama -->
                <div class="hero-name">
                    <span>Hadi</span>
                    <small>&</small>
                    <span>Claud</span>
                </div>


                <!-- Lokasi -->
                <div class="location">

                    <div class="location-icon">
                        📍
                    </div>

                    <div class="location-line"></div>

                    <p>Bekasi</p>

                </div>


                <!-- Tombol kalender -->
                <button class="calendar-button" id="calendarButton">
                    <span>▣</span>
                    Simpan Kalender
                </button>

            </div>

        </section>




        <section class="wedding-section">

            <div class="wedding-background"></div>

            <div class="wedding-content">

                <!-- Tanggal -->
                <div class="wedding-date">

                    <span>30</span>
                    <span>12</span>
                    <span>2026</span>

                </div>


                <!-- Foto pasangan -->
                <div class="couple-wrapper">

                    <div class="couple-photo couple-left">
                        <img src="assets/claud.jpg" alt="Claud">
                    </div>

                    <div class="couple-photo couple-right">
                        <img src="assets/hadi.jpg" alt="Hadi">
                    </div>

                    <div class="couple-name">
                        Hadi & Claud
                    </div>

                </div>


                <!-- Lokasi -->
                <div class="wedding-location">

                    <div class="map-icon">
                        📍
                    </div>

                    <div class="dotted-line"></div>

                    <h3>LOKASI</h3>

                    <p>Bekasi</p>

                </div>


                <!-- Kalender -->
                <button class="calendar-button bottom-calendar" id="calendarButton2">
                    <span>▣</span>
                    Simpan Kalender
                </button>

            </div>

        </section>


        <section class="countdown-section">

            <h2>Menuju Hari Bahagia</h2>

            <div class="countdown">

                <div class="count-box">
                    <span id="days">0</span>
                    <small>Hari</small>
                </div>

                <div class="count-box">
                    <span id="hours">0</span>
                    <small>Jam</small>
                </div>

                <div class="count-box">
                    <span id="minutes">0</span>
                    <small>Menit</small>
                </div>

                <div class="count-box">
                    <span id="seconds">0</span>
                    <small>Detik</small>
                </div>

            </div>

        </section>


        <!-- ==================================================
             FOOTER
        ================================================== -->

        <footer>

            <p>Hadi & Claud</p>

            <span>30 Desember 2026</span>

        </footer>

    </main>


    <!-- Tombol Musik -->
    <button class="music-button" id="musicButton">
        ♫
    </button>

    <audio id="backgroundMusic" loop>
        <source src="assets/music.mp3" type="audio/mpeg">
    </audio>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
